  <text x="618.0" y="198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5ee6b8" text-anchor="middle">12</text>
  <text x="618.0" y="217" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="2" fill="#9cc6d6" text-anchor="middle">PUBLIC REPOS</text>
