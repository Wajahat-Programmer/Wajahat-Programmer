<svg xmlns="http://www.w3.org/2000/svg" width="840" height="296" viewBox="0 0 840 296" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071323"/>
      <stop offset="0.55" stop-color="#0b2034"/>
      <stop offset="1" stop-color="#0d2c3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#49d6ec" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#49d6ec" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#49d6ec" fill-opacity="0.10"/>
