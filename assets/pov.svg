  <text x="40" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#9cc6d6" text-anchor="start">THE POINT OF VIEW</text>
  <text x="36" y="132" font-family="Georgia, serif" font-size="78" fill="#5ee6b8" fill-opacity="0.9">&#8220;</text>
  <text x="84" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600" fill="#f2fbff" text-anchor="start">Software for a medical practice has one</text>
  <text x="84" y="132" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600" fill="#f2fbff" text-anchor="start">job: get the device reading into the</text>
  <text x="84" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600" fill="#f2fbff" text-anchor="start">chart and the claim out the door,</text>
  <text x="84" y="188" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600" fill="#f2fbff" text-anchor="start">without a clinician typing it twice.</text>
  <rect x="84" y="210" width="46" height="3" rx="1.5" fill="#49d6ec"/>
  <text x="84" y="236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9cc6d6" text-anchor="start">Small teams, tested edge cases, and code that is safe to</text>
  <text x="84" y="255" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9cc6d6" text-anchor="start">run near patient data.</text>
  <rect x="548" y="34" width="252" height="228" rx="12" fill="#0f2a40" fill-opacity="0.72" stroke="#2c6480" stroke-width="1"/>
  <text x="568" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2" fill="#5ee6b8" text-anchor="start">PROFILE</text>
  <text x="568" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="2" fill="#9cc6d6" text-anchor="start">ROLE</text>
  <text x="632" y="90" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2fbff" text-anchor="start">Sr. Software Engineer</text>
  <text x="568" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="2" fill="#9cc6d6" text-anchor="start">BASED</text>
  <text x="632" y="116" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2fbff" text-anchor="start">Islamabad, Pakistan</text>
  <text x="568" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="2" fill="#9cc6d6" text-anchor="start">FOCUS</text>
  <text x="632" y="142" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f2fbff" text-anchor="start">Healthcare software</text>
