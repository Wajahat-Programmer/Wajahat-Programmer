  <rect x="1" y="1" width="838" height="294" rx="18" fill="url(#bg)" stroke="#2c6480" stroke-width="1.5"/>
  <clipPath id="card"><rect x="1" y="1" width="838" height="294" rx="18"/></clipPath>
